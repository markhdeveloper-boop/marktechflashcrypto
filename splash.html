<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
    }

    .box {
      text-align: center;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
      margin-bottom: 10px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="loader"></div>
    <h2>MarkTech FlashWallet</h2>
    <p>Loading secure wallet...</p>
  </div>
</body>
</html>
